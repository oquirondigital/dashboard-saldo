<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oquíron — Saldo Meta Ads</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080c14;
  --surface:#0d1117;
  --surface2:#111820;
  --border:#161e2a;
  --text:#e8edf5;
  --text-dim:#6b7a8d;
  --text-muted:#3a4455;
  --cyan:#06b6d4;
  --cyan-dim:rgba(6,182,212,0.08);
  --green:#10b981;
  --green-dim:rgba(16,185,129,0.08);
  --yellow:#f59e0b;
  --yellow-dim:rgba(245,158,11,0.08);
  --red:#f43f5e;
  --red-dim:rgba(244,63,94,0.08);
  --blue:#3b82f6;
  --blue-dim:rgba(59,130,246,0.08);
}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;font-size:13px;min-height:100vh}

/* ── LOGIN ── */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
.login-box{width:100%;max-width:340px}
.login-logo{font-size:28px;font-weight:700;letter-spacing:-1px;color:var(--text);margin-bottom:4px}
.login-logo span{color:var(--cyan)}
.login-tagline{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:2px;margin-bottom:48px}
.login-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-dim);display:block;margin-bottom:10px}
.login-input-wrap{position:relative}
.login-input{width:100%;background:transparent;border:none;border-bottom:1px solid var(--border);padding:10px 0;color:var(--text);font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:border-color .3s;letter-spacing:1px}
.login-input:focus{border-color:var(--cyan)}
.login-input::placeholder{color:var(--text-muted)}
.login-btn{margin-top:32px;background:transparent;border:1px solid var(--cyan);border-radius:6px;padding:12px 28px;color:var(--cyan);font-size:12px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:2px;text-transform:uppercase;transition:all .2s;display:block;width:100%}
.login-btn:hover{background:var(--cyan);color:var(--bg)}
.login-erro{margin-top:16px;font-size:11px;color:var(--red);letter-spacing:1px;text-transform:uppercase;display:none}

/* ── TOPBAR ── */
.dashboard{display:none;flex-direction:column;min-height:100vh}
.topbar{padding:20px 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:10}
.topbar-brand{font-size:14px;font-weight:700;letter-spacing:-0.3px;color:var(--text)}
.topbar-brand span{color:var(--cyan)}
.topbar-center{display:flex;align-items:center;gap:6px}
.topbar-badge{font-size:10px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;letter-spacing:.5px}
.topbar-dot{width:5px;height:5px;border-radius:50%;background:var(--green);animation:pulse-dot 2s infinite}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.8)}}
.topbar-right{display:flex;align-items:center;gap:12px}
.btn-eye{background:transparent;border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--text-dim);font-size:14px;line-height:1;transition:all .2s}
.btn-eye:hover{border-color:var(--cyan);color:var(--cyan)}

/* ── KPI ROW ── */
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--border)}
.kpi{padding:24px 28px;border-right:1px solid var(--border)}
.kpi:last-child{border-right:none}
.kpi-label{font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-muted);margin-bottom:10px}
.kpi-value{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1;color:var(--text)}
.kpi-value.ok{color:var(--green)}.kpi-value.warn{color:var(--yellow)}.kpi-value.bad{color:var(--red)}.kpi-value.cyan{color:var(--cyan)}

/* ── CONTENT ── */
.content{padding:32px;flex:1}
.section-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;margin-top:32px}
.section-header:first-child{margin-top:0}
.section-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--text-muted)}
.section-line{flex:1;height:1px;background:var(--border)}
.section-count{font-size:9px;color:var(--text-muted);font-family:'JetBrains Mono',monospace}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:1px;background:var(--border)}

/* ── CARD ── */
.card{background:var(--bg);padding:20px;position:relative;overflow:hidden;opacity:0;animation:fadeUp .4s ease forwards}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px}
.card.verde::before{background:var(--green);box-shadow:0 0 12px var(--green)}
.card.amarelo::before{background:var(--yellow);box-shadow:0 0 12px var(--yellow);animation:glow-warn 2.5s ease-in-out infinite}
.card.vermelho::before{background:var(--red);box-shadow:0 0 12px var(--red);animation:glow-red 1.8s ease-in-out infinite}
.card.cartao::before{background:var(--blue)}
@keyframes glow-warn{0%,100%{box-shadow:0 0 8px var(--yellow)}50%{box-shadow:0 0 20px var(--yellow)}}
@keyframes glow-red{0%,100%{box-shadow:0 0 8px var(--red)}50%{box-shadow:0 0 24px var(--red)}}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.card-nome{font-size:12px;font-weight:600;color:var(--text);letter-spacing:.2px}
.card-nome.oculto{color:var(--text-muted);letter-spacing:2px}
.chip{font-size:9px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap;text-transform:uppercase;letter-spacing:.8px}
.chip.ok{background:var(--green-dim);color:var(--green)}.chip.warn{background:var(--yellow-dim);color:var(--yellow)}.chip.bad{background:var(--red-dim);color:var(--red)}.chip.neutral{background:var(--blue-dim);color:var(--blue)}
.card-saldo{font-size:26px;font-weight:700;font-family:'JetBrains Mono',monospace;line-height:1;margin-bottom:4px}
.card-saldo.verde{color:var(--green)}.card-saldo.amarelo{color:var(--yellow)}.card-saldo.vermelho{color:var(--red)}
.card-dias{font-size:10px;color:var(--text-dim);margin-bottom:16px;letter-spacing:.2px}
.card-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-top:14px;border-top:1px solid var(--border)}
.stat-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--text-muted);margin-bottom:3px}
.stat-value{font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace;color:var(--text-dim)}
.card-alerta{margin-top:12px;font-size:9px;font-weight:700;color:var(--red);letter-spacing:1px;text-transform:uppercase}

/* ── ESTADO ── */
.estado{text-align:center;padding:80px 20px;color:var(--text-muted)}
.estado-icon{font-size:36px;margin-bottom:12px}
.estado-title{font-size:14px;font-weight:600;color:var(--text-dim);margin-bottom:6px}

/* ── MOBILE ── */
@media(max-width:768px){
  .topbar{padding:14px 16px}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .kpi{padding:16px}
  .kpi-value{font-size:22px}
  .content{padding:16px}
  .grid{grid-template-columns:1fr 1fr}
}
@media(max-width:480px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="login-wrap">
  <div class="login-box">
    <div class="login-logo">Oquíron<span>.</span></div>
    <div class="login-tagline">Meta Ads Monitor</div>
    <label class="login-label">Senha de acesso</label>
    <div class="login-input-wrap">
      <input class="login-input" type="password" id="senha" placeholder="••••••••" onkeydown="if(event.key==='Enter')entrar()">
    </div>
    <button class="login-btn" onclick="entrar()">Entrar</button>
    <div class="login-erro" id="erro">Senha incorreta</div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="topbar">
    <div class="topbar-brand">Oquíron<span>.</span></div>
    <div class="topbar-center">
      <div class="topbar-dot"></div>
      <div class="topbar-badge" id="top-date">—</div>
    </div>
    <div class="topbar-right">
      <button class="btn-eye" id="btn-eye" onclick="toggleNomes()" title="Ocultar/mostrar nomes">👁</button>
    </div>
  </div>

  <div class="kpi-row" id="kpi-row">
    <div class="kpi"><div class="kpi-label">Total Contas</div><div class="kpi-value">—</div></div>
    <div class="kpi"><div class="kpi-label">OK</div><div class="kpi-value ok">—</div></div>
    <div class="kpi"><div class="kpi-label">Críticos</div><div class="kpi-value warn">—</div></div>
    <div class="kpi"><div class="kpi-label">Esgotados</div><div class="kpi-value bad">—</div></div>
    <div class="kpi"><div class="kpi-label">Gasto no Mês</div><div class="kpi-value cyan" style="font-size:18px">—</div></div>
  </div>

  <div class="content" id="conteudo">
    <div class="estado"><div class="estado-icon">⏳</div><div class="estado-title">Carregando dados...</div></div>
  </div>
</div>

<script>
const WORKER_URL='https://boletim-saldo-api.super-boat-3c8f.workers.dev/api';
let SENHA_SESSAO='';
let nomesVisiveis=true;

function toggleNomes(){
  nomesVisiveis=!nomesVisiveis;
  const btn=document.getElementById('btn-eye');
  btn.textContent=nomesVisiveis?'👁':'🙈';
  document.querySelectorAll('.card-nome').forEach(el=>{
    el.classList.toggle('oculto',!nomesVisiveis);
    if(!nomesVisiveis){el.dataset.original=el.dataset.original||el.textContent;el.textContent='••••••••';}
    else{el.textContent=el.dataset.original||el.textContent;}
  });
}

function entrar(){
  const s=document.getElementById('senha').value;
  if(!s)return;
  SENHA_SESSAO=s;
  load(true);
}

function fBRL(v){const n=parseFloat(v)||0;return'R$ '+n.toFixed(2).replace('.',',').replace(/\B(?=(\d{3})+(?!\d))/g,'.')}
function fDate(iso){if(!iso)return'—';return new Date(iso).toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function crit(c){if(c.modelo==='cartao'){return(parseFloat(c.media_diaria)===0&&parseFloat(c.gasto_mes)>0)?'vermelho':'cartao'}if(parseFloat(c.saldo_disponivel)===0)return'vermelho';if(c.dias_restantes!==null&&c.dias_restantes<=0)return'vermelho';if(c.dias_restantes!==null&&c.dias_restantes<=5)return'amarelo';return'verde'}
function chipHTML(cr){const map={verde:['ok','OK'],amarelo:['warn','Crítico'],vermelho:['bad','Esgotado'],cartao:['neutral','Cartão']};const[cls,label]=map[cr]||['neutral',cr];return`<span class="chip ${cls}">${label}</span>`}
function diasLabel(c){if(c.modelo==='cartao'){if(parseFloat(c.media_diaria)===0&&parseFloat(c.gasto_mes)>0)return'🚨 Conta parada — investigar';return c.forma_pagamento||'Cartão cadastrado'}if(c.dias_restantes===-1||c.dias_restantes===null)return'Sem atividade nos últimos 7 dias';if(parseFloat(c.saldo_disponivel)===0)return'Saldo esgotado';if(c.dias_restantes<=0)return'Saldo insuficiente (< 1 dia)';return`${c.dias_restantes} dias restantes`}
function saldoClass(cr){if(cr==='vermelho')return'vermelho';if(cr==='amarelo')return'amarelo';return'verde'}

function renderCard(c,delay){
  const cr=crit(c);const isPre=c.modelo!=='cartao';const sc=saldoClass(cr);
  const alerta=cr==='vermelho'&&c.modelo==='cartao'?'<div class="card-alerta">⚠ Conta parada</div>':'';
  return`<div class="card ${cr}" style="animation-delay:${delay}ms"><div class="card-top"><div class="card-nome">${c.cliente}</div>${chipHTML(cr)}</div>${isPre?`<div class="card-saldo ${sc}">${fBRL(c.saldo_disponivel)}</div>`:''}<div class="card-dias">${diasLabel(c)}</div><div class="card-stats"><div><div class="stat-label">Média 7d</div><div class="stat-value">${fBRL(c.media_diaria)}/dia</div></div><div><div class="stat-label">Gasto no Mês</div><div class="stat-value">${fBRL(c.gasto_mes)}</div></div></div>${alerta}</div>`
}

function renderKPI(clientes){
  const total=clientes.length;
  const ok=clientes.filter(c=>crit(c)==='verde'||crit(c)==='cartao').length;
  const criticos=clientes.filter(c=>crit(c)==='amarelo').length;
  const esgotados=clientes.filter(c=>crit(c)==='vermelho').length;
  const gasto=clientes.reduce((s,c)=>s+(parseFloat(c.gasto_mes)||0),0);
  document.getElementById('kpi-row').innerHTML=`
    <div class="kpi"><div class="kpi-label">Total Contas</div><div class="kpi-value">${total}</div></div>
    <div class="kpi"><div class="kpi-label">OK</div><div class="kpi-value ok">${ok}</div></div>
    <div class="kpi"><div class="kpi-label">Críticos</div><div class="kpi-value warn">${criticos}</div></div>
    <div class="kpi"><div class="kpi-label">Esgotados</div><div class="kpi-value bad">${esgotados}</div></div>
    <div class="kpi"><div class="kpi-label">Gasto no Mês</div><div class="kpi-value cyan" style="font-size:18px">${fBRL(gasto)}</div></div>
  `;
}

async function load(isLogin=false){
  try{
    const res=await fetch(WORKER_URL,{headers:{'X-Dashboard-Password':SENHA_SESSAO}});
    if(res.status===401){if(isLogin){document.getElementById('erro').style.display='block';SENHA_SESSAO='';}return;}
    const data=await res.json();
    document.getElementById('login-wrap').style.display='none';
    document.getElementById('dashboard').style.display='flex';
    sessionStorage.setItem('oq_senha',SENHA_SESSAO);
    if(data.error){document.getElementById('conteudo').innerHTML='<div class="estado"><div class="estado-icon">📭</div><div class="estado-title">Sem dados disponíveis</div></div>';return;}
    const clientes=data.clientes||[];
    document.getElementById('top-date').textContent=fDate(data.ultima_atualizacao);
    renderKPI(clientes);
    const ordem={vermelho:0,amarelo:1,verde:2,cartao:3};
    const prepago=clientes.filter(c=>c.modelo!=='cartao').sort((a,b)=>ordem[crit(a)]-ordem[crit(b)]);
    const cartao=clientes.filter(c=>c.modelo==='cartao').sort((a,b)=>ordem[crit(a)]-ordem[crit(b)]);
    let html='';
    if(prepago.length){
      html+=`<div class="section-header"><div class="section-title">Pré-pago</div><div class="section-line"></div><div class="section-count">${prepago.length}</div></div>`;
      html+=`<div class="grid">${prepago.map((c,i)=>renderCard(c,i*60)).join('')}</div>`;
    }
    if(cartao.length){
      html+=`<div class="section-header"><div class="section-title">Cartão</div><div class="section-line"></div><div class="section-count">${cartao.length}</div></div>`;
      html+=`<div class="grid">${cartao.map((c,i)=>renderCard(c,i*60)).join('')}</div>`;
    }
    document.getElementById('conteudo').innerHTML=html;
    if(!nomesVisiveis){document.querySelectorAll('.card-nome').forEach(el=>{el.dataset.original=el.textContent;el.textContent='••••••••';el.classList.add('oculto');});}
  }catch(e){
    if(document.getElementById('dashboard').style.display==='flex'){
      document.getElementById('conteudo').innerHTML=`<div class="estado"><div class="estado-icon">⚠️</div><div class="estado-title">Erro ao carregar</div></div>`;
    }
  }
}

const senhaCache=sessionStorage.getItem('oq_senha');
if(senhaCache){SENHA_SESSAO=senhaCache;load();}
setInterval(()=>{if(SENHA_SESSAO)load();},5*60*1000);
</script>
</body>
</html>
